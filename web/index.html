<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Inversiones D'Caro - Punto de Venta e Inventario">
  <meta name="theme-color" content="#0A2E50">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D'Caro POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inversiones D'Caro - POS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #pwa-install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0A2E50;
      color: white;
      padding: 12px 18px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
      animation: pwaSlideUp 0.4s ease-out;
    }
    #pwa-install-banner button {
      background: #0284C7;
      color: white;
      border: none;
      padding: 7px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    #pwa-install-banner .close-btn {
      background: transparent;
      color: rgba(255,255,255,0.7);
      padding: 4px 8px;
      font-size: 16px;
    }
    @keyframes pwaSlideUp {
      from { transform: translate(-50%, 50px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="pwa-install-banner">
    <span>📲 <b>Instalar App en el Teléfono</b></span>
    <button id="pwa-btn-install">Instalar</button>
    <button class="close-btn" id="pwa-btn-close">✕</button>
  </div>

  <script>
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.deferredPwaPrompt = e;

      if (!isStandalone) {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'flex';
      }
    });

    document.getElementById('pwa-btn-install')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwa-install-banner').style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    document.getElementById('pwa-btn-close')?.addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('pwa-install-banner').style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('pwa-install-banner').style.display = 'none';
      deferredPrompt = null;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
